spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/clarity
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update          # use 'validate' in prod
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}      # Gmail App Password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

clarity:
  jwt:
    secret: ${JWT_SECRET:changeme-use-a-long-random-string-in-production}
    expiration-ms: 86400000        # 24 hours
  diary:
    pin-hash-rounds: 10            # BCrypt rounds for diary PIN
